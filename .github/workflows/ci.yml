name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate QA data
        run: |
          python tools/validate_repository.py
          python tools/check_traceability.py
          python tools/risk_score.py
      - name: Lint and type check
        run: |
          ruff check .
          mypy src
      - name: Test with coverage
        run: |
          mkdir -p reports/local
          pytest --junitxml=reports/local/junit.xml --cov=sentinel_uas --cov-report=xml:reports/local/coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-test-evidence
          path: reports/local/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install service and browser dependencies
        run: |
          python -m pip install .
          npm install
          npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
