[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sentinel-uas-assurance-lab"
version = "0.1.0"
description = "Simulation-only QA and cyber-resilience lab for high-consequence unmanned aircraft systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2.0",
  "httpx>=0.27,<1.0",
  "hypothesis>=6.120,<7.0",
  "locust>=2.32,<3.0",
  "mypy>=2.3,<3.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
sentinel-uas = "sentinel_uas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_uas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "api: API-level tests",
  "contract: OpenAPI and interface contract tests",
  "property: property-based tests",
  "resilience: degraded-condition and recovery tests",
  "security: authentication, authorization, and abuse-case tests",
  "unit: isolated domain tests",
]

[tool.coverage.run]
branch = true
source = ["sentinel_uas"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
